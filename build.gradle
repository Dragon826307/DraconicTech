import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "v" + project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"draconictech" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnlyApi fileTree(dir: 'libs/client', include: ['*.jar'])
    implementation "org.checkerframework:checker-util:4.2.1"
    include "org.checkerframework:checker-util:4.2.1"
}

afterEvaluate {
    configurations.runtimeClasspath.forEach { file ->
        if (file.name.contains("sponge-mixin")) {
            tasks.named("runClient", JavaExec).get().jvmArgs("-javaagent:${file.absolutePath}")
        }
    }
}

def generatedLangDir = layout.buildDirectory.dir("generated/lang_resources").get().asFile

tasks.register('mergeFragmentedLang') {
    def javaSrcDir = file("src/main/java")
    def resourcesLangDir = file("src/main/resources/assets/draconictech/lang")
    inputs.dir(javaSrcDir)
    inputs.dir(resourcesLangDir).optional()
    outputs.dir(generatedLangDir)
    doLast {
        def slurper = new JsonSlurper()
        def mergedLang = [:]
        if (resourcesLangDir.exists()) {
            resourcesLangDir.eachFileMatch(~/.*\.json/) { file ->
                def langName = file.name.replace(".json", "")
                def jsonContent = slurper.parse(file)
                if (!mergedLang.containsKey(langName)) {
                    mergedLang[langName] = [:]
                }
                mergedLang[langName].putAll(jsonContent)
            }
        }
        javaSrcDir.eachFileRecurse { file ->
            if (file.name == 'lang.json') {
                def relativePath = javaSrcDir.toPath().relativize(file.toPath()).toString()
                def pkgPath = relativePath.replace(File.separator, "/").replaceAll("/lang\\.json\$", "")
                def pkgName = pkgPath.replace("/", ".")
                def jsonContent = slurper.parse(file)
                jsonContent.each { langName, translations ->
                    if (!mergedLang.containsKey(langName)) {
                        mergedLang[langName] = [:]
                    }
                    translations.each { key, value ->
                        def fullKey = "${pkgName}.${key}"
                        mergedLang[langName][fullKey] = value
                    }
                }
            }
        }
        def targetLangDir = new File(generatedLangDir, "assets/draconictech/lang")
        targetLangDir.mkdirs()
        mergedLang.each { langName, translations ->
            def outFile = new File(targetLangDir, "${langName}.json")
            outFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(translations))
        }
        println "Merged fragmented lang.json files into ${targetLangDir}"
    }
}

sourceSets.main.resources.srcDir(mergeFragmentedLang)

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    dependsOn mergeFragmentedLang

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.matching { it.name == 'sourcesJar'}.configureEach {
    dependsOn mergeFragmentedLang
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
